<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BATCH LOG</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #e0f7fa;
        }

        .job-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-square {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 20px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .page-link {
            margin: 0 5px;
            padding: 5px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            color: #007bff;
            text-decoration: none;
        }

        .page-link.active {
            background-color: #007bff;
            color: white;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="job-container">
    <div class="top-bar">
        <a th:href="@{/home}" class="btn btn-outline-secondary btn-square">←</a>
        <button id="refreshBtn" class="btn btn-outline-primary btn-square">⟳</button>
    </div>

    <div class="title">BATCH LOG</div>

    <table>
        <thead>
        <tr>
            <th>Job Name</th>
            <th>Status</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Duration</th>
        </tr>
        </thead>
        <tbody id="logList">
        <tr th:each="log : ${logs}">
            <td th:text="${log.jobName}">JobName</td>
            <td th:text="${log.status}">Status</td>
            <td th:attr="data-start-time=${log.startTime}"
                th:text="${#temporals.format(log.startTime, 'yyyy-MM-dd / HH:mm')}">StartTime</td>
            <td th:attr="data-end-time=${log.endTime}"
                th:text="${#temporals.format(log.endTime, 'yyyy-MM-dd / HH:mm')}">EndTime</td>
            <td class="duration-cell">-</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:href="@{/batchPal/jobs(page=0)}" class="page-link">&laquo;</a>
        <a th:href="@{/batchPal/jobs(page=${page.number - 1})}" th:if="${page.number > 0}" class="page-link">&lsaquo;</a>

        <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
           th:classappend="${page.number == i} ? 'active'"
           th:text="${i + 1}"
           th:href="@{/batchPal/jobs(page=${i})}"
           class="page-link"></a>

        <a th:href="@{/batchPal/jobs(page=${page.number + 1})}" th:if="${page.number + 1 < page.totalPages}" class="page-link">&rsaquo;</a>
        <a th:href="@{/batchPal/jobs(page=${page.totalPages - 1})}" class="page-link">&raquo;</a>
    </div>
</div>

<script>
    function formatTime(isoStr) {
        const date = new Date(isoStr);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd} / ${hh}:${min}`;
    }

    function getDuration(start, end) {
        if (!start || !end) return '-';
        const startTime = new Date(start);
        const endTime = new Date(end);
        const diffMs = endTime - startTime;
        const mins = Math.floor(diffMs / 60000);
        const secs = Math.floor((diffMs % 60000) / 1000);
        return `${mins}분 ${secs}초`;
    }

    function updateDurations() {
        const rows = document.querySelectorAll("#logList tr");
        rows.forEach(row => {
            const start = row.children[2].getAttribute("data-start-time");
            const end = row.children[3].getAttribute("data-end-time");
            row.children[4].textContent = getDuration(start, end);
        });
    }

    document.addEventListener("DOMContentLoaded", updateDurations);

    document.getElementById("refreshBtn").addEventListener("click", () => {
        fetch("/batchPal/getLog")
            .then(res => res.json())
            .then(data => {
                const logList = document.getElementById("logList");
                logList.innerHTML = "";
                data.forEach(log => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${log.jobName}</td>
                        <td>${log.status}</td>
                        <td data-start-time="${log.startTime}">${formatTime(log.startTime)}</td>
                        <td data-end-time="${log.endTime}">${formatTime(log.endTime)}</td>
                        <td class="duration-cell">${getDuration(log.startTime, log.endTime)}</td>
                    `;
                    logList.appendChild(tr);
                });
            });
    });
</script>
</body>
</html>
